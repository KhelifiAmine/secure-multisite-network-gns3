!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!

!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname CE-Nabeul
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
!
!
!
!
!
no ip domain lookup
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
crypto isakmp policy 1
 authentication pre-share
crypto isakmp key 6 ******** address 11.0.0.1       
!
crypto ipsec security-association lifetime seconds 4096
!
crypto ipsec transform-set strong esp-3des esp-md5-hmac 
 mode tunnel
!
!
!
crypto map S2SVPN 10 ipsec-isakmp 
 set peer 11.0.0.1
 set transform-set strong 
 match address 101
!
!
!
!
!
interface Tunnel0
 ip address 172.16.1.2 255.255.255.0
 ip mtu 1400
 tunnel source Serial1/1
 tunnel destination 11.0.0.1
!
interface FastEthernet0/0
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet0/1
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface Serial1/0
 ip address 192.168.11.2 255.255.255.252
 serial restart-delay 0
!
interface Serial1/1
 ip address 11.0.2.2 255.255.255.252
 ip nat outside
 serial restart-delay 0
 crypto map S2SVPN
!
interface Serial1/2
 ip address 192.168.6.1 255.255.255.0
 ip nat inside
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
!
router eigrp 100
 network 192.168.6.0 0.0.0.3
 network 192.168.11.0 0.0.0.3
!
ip nat inside source list 1 interface Serial1/1 overload
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 Serial1/1
ip route 192.168.0.0 255.255.252.0 172.16.1.1
ip route 192.168.4.0 255.255.255.0 Serial1/2
ip route 192.168.5.0 255.255.255.0 Serial1/2
!
access-list 1 permit 192.168.4.0 0.0.0.255
access-list 100 deny   ip 192.168.4.0 0.0.3.255 192.168.0.0 0.0.3.255
access-list 100 permit ip 192.168.4.0 0.0.0.255 any
access-list 101 permit gre host 11.0.2.2 host 11.0.0.1
!
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
