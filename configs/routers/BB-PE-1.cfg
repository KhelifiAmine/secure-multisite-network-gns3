!
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname BB-PE-1
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
no ip icmp rate-limit unreachable
ip cef
!
ip vrf hightech
 rd 100:1
 route-target export 1:100
 route-target import 1:100
!
!
!
!
!
!
no ip domain lookup
no ipv6 cef
!
!
multilink bundle-name authenticated
!
!
!
!
!
!
!
!
!
ip tcp synwait-time 5
! 
!
!
!
!
!
!
!
!
!
!
!
interface Loopback0
 ip address 209.0.1.1 255.255.255.0
 ip ospf network point-to-point
!
interface FastEthernet0/0
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface FastEthernet0/1
 no ip address
 shutdown
 speed auto
 duplex auto
!
interface Serial1/0
 ip vrf forwarding hightech
 ip address 192.168.7.2 255.255.255.252
 serial restart-delay 0
!
interface Serial1/1
 ip address 192.168.8.1 255.255.255.252
 mpls ip
 serial restart-delay 0
!
interface Serial1/2
 no ip address
 shutdown
 serial restart-delay 0
!
interface Serial1/3
 no ip address
 shutdown
 serial restart-delay 0
!
!
router eigrp 100
 !
 address-family ipv4 vrf hightech 
  redistribute bgp 1 metric 1 1 1 1 1
  network 192.168.7.0 0.0.0.3
  autonomous-system 100
 exit-address-family
!
router ospf 1
 network 192.168.8.0 0.0.0.3 area 0
 network 209.0.1.0 0.0.0.255 area 0
!
router bgp 1
 bgp log-neighbor-changes
 neighbor 209.0.4.1 remote-as 1
 neighbor 209.0.4.1 update-source Loopback0
 !
 address-family vpnv4
  neighbor 209.0.4.1 activate
  neighbor 209.0.4.1 send-community both
 exit-address-family
 !
 address-family ipv4 vrf hightech
  redistribute static
  redistribute eigrp 100
 exit-address-family
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route vrf hightech 192.168.1.0 255.255.255.0 Serial1/0
ip route vrf hightech 192.168.2.0 255.255.255.0 Serial1/0
!
!
mpls ldp router-id Loopback0 force
!
!
control-plane
!
!
line con 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line aux 0
 exec-timeout 0 0
 privilege level 15
 logging synchronous
 stopbits 1
line vty 0 4
 login
!
!
end
