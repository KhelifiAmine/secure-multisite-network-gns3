# /etc/vsftpd.conf
# Basic Settings
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

# SECURITY HARDENING
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive ports for firewall rules
pasv_min_port=30000
pasv_max_port=31000

# Logging
xferlog_file=/var/log/vsftpd.log
log_ftp_protocol=YES

# Connection limits
max_clients=100
max_per_ip=5

# Timeouts
idle_session_timeout=300
data_connection_timeout=300

# Network binding
listen_address=10.10.10.20
