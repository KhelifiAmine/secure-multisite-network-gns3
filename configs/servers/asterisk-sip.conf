; /etc/asterisk/sip.conf (excerpt: general section, user template and first extensions)
[general]
; Network and Binding
bindaddr = 0.0.0.0
srvlookup = no
localnet = 10.10.10.0/255.255.255.0

; SECURITY HARDENING
context = public
alwaysauthreject = yes ; Don't leak valid users
allowguest = no ; CRITICAL: No anonymous calls
allowoverlap = no
realm = hightech.int
match_auth_username = yes ; Extra security

disallow=all
allow=ulaw,alaw,gsm

; Transport
tcpenable = yes
tcpbindaddr = 0.0.0.0
transport = udp,tcp

; NAT Support for clients behind pfSense
nat = force_rport,comedia

; Define a USER TEMPLATE for common settings
[user_template](!)
type = friend
host = dynamic
context = internal
dtmfmode = rfc2833
; RESTRICT TO INTERNAL NETWORK ONLY - CORRECT NETWORK
deny = 0.0.0.0/0.0.0.0
permit = 10.10.10.0/255.255.255.0
qualify = yes
canreinvite = no ; Security against reinvite attacks
encryption = no

; Define our USERS - THESE WILL BE BRUTEFORCED LATER!
[1000](user_template)
secret = ********

[2000](user_template)
secret = ********
